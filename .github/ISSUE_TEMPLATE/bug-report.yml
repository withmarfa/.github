name: Bug report
description: Something in Marfa, or in an app built on it, does not work as it should.
type: Bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of Marfa or of the app, or the commit if you built it yourself.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Where it ran, with its version. For example macOS, iOS, Linux or Docker.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Paste logs, or drag screenshots in.
